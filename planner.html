<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Planner" />
<meta name="theme-color" content="#0d1117" />
<title>June Planner — Inika</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2230; --border:#30363d;
  --accent:#58a6ff; --green:#7ee787; --yellow:#e3b341; --red:#f85149;
  --text:#e6edf3; --muted:#8b949e; --purple:#bc8cff;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;}
body{padding-bottom:84px;min-height:100vh;}
a{color:var(--accent);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:15px;}
.hide{display:none!important;}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;}
header h1{font-size:17px;font-weight:700;letter-spacing:-.2px;}
header h1 span{color:var(--muted);font-weight:500;}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);transition:.3s;}
.dot.saving{background:var(--yellow);} .dot.error{background:var(--red);}
.ring{--p:0;position:relative;width:38px;height:38px;border-radius:50%;flex:none;
  background:conic-gradient(var(--green) calc(var(--p)*1%), #2a3140 0);
  display:grid;place-items:center;font-size:11px;font-weight:700;}
.ring::after{content:'';position:absolute;width:28px;height:28px;border-radius:50%;background:var(--bg);}
.ring b{position:relative;z-index:1;}

/* ---------- layout ---------- */
main{max-width:880px;margin:0 auto;padding:18px 16px;}
.view{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 2px 12px;font-weight:600;}
h2.section:first-child{margin-top:4px;}

/* ---------- bottom nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(22,27,34,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--border);display:flex;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600;}
nav button.active{color:var(--accent);}
nav button .ic{font-size:20px;line-height:1;}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.rock{overflow:hidden;padding:0;}
.rock-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
.rock-emoji{font-size:22px;width:30px;text-align:center;}
.rock-title{font-weight:600;font-size:16px;flex:1;}
.rock-meta{font-size:12px;color:var(--muted);}
.bar{height:6px;border-radius:4px;background:#2a3140;overflow:hidden;margin-top:8px;}
.bar > i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s;}
.rock-body{border-top:1px solid var(--border);padding:6px 12px 12px;}
.chev{color:var(--muted);transition:transform .2s;font-size:13px;}
.rock.open .chev{transform:rotate(90deg);}

/* ---------- milestone rows ---------- */
.ms{display:flex;align-items:flex-start;gap:11px;padding:11px 6px;border-bottom:1px solid #21262d;}
.ms:last-child{border-bottom:none;}
.check{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--border);margin-top:1px;display:grid;place-items:center;font-size:13px;color:transparent;transition:.15s;}
.check.done{background:var(--green);border-color:var(--green);color:#0d1117;}
.check.prog{border-color:var(--yellow);color:var(--yellow);}
.ms-main{flex:1;min-width:0;}
.ms-title{font-size:15px;line-height:1.35;}
.ms.done .ms-title{text-decoration:line-through;color:var(--muted);}
.ms-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);display:inline-flex;align-items:center;gap:4px;}
.tag.due{color:var(--text);} .tag.over{background:rgba(248,81,73,.15);color:#ff9d96;border-color:rgba(248,81,73,.4);}
.tag.soon{background:rgba(227,179,65,.15);color:#f0cf7a;border-color:rgba(227,179,65,.4);}
.tag.p1{color:#ff9d96;border-color:rgba(248,81,73,.4);}
.tag.sched{color:var(--accent);border-color:rgba(88,166,255,.4);}
.ms-edit{margin-left:auto;color:var(--muted);font-size:16px;padding:2px 6px;}

/* ---------- buttons ---------- */
.btn{background:var(--accent);color:#08121f;font-weight:600;padding:11px 16px;border-radius:10px;font-size:14px;display:inline-flex;align-items:center;gap:7px;}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn.sm{padding:7px 12px;font-size:13px;}
.btn.full{width:100%;justify-content:center;}
.add-line{margin:6px 2px 2px;}

/* ---------- schedule ---------- */
.weekstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;}
.daybtn{flex:none;min-width:48px;padding:8px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--border);text-align:center;}
.daybtn .dn{font-size:11px;color:var(--muted);} .daybtn .dd{font-size:17px;font-weight:700;margin-top:2px;}
.daybtn.active{background:var(--accent);border-color:var(--accent);color:#08121f;}
.daybtn.active .dn{color:#08121f;}
.daybtn.today .dd{color:var(--accent);} .daybtn.active.today .dd{color:#08121f;}
.slot{display:flex;gap:10px;padding:9px 0;border-top:1px solid #21262d;}
.slot-time{flex:none;width:62px;font-size:12px;color:var(--muted);padding-top:9px;text-align:right;}
.slot-body{flex:1;display:flex;flex-direction:column;gap:6px;min-height:34px;}
.evt{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:10px;}
.evt.done{opacity:.55;} .evt.done .evt-t{text-decoration:line-through;}
.evt-t{flex:1;font-size:14px;}
.evt .check{width:20px;height:20px;}
.slot-add{align-self:flex-start;color:var(--muted);font-size:13px;padding:5px 0;}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:520px;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1);}
@keyframes up{from{transform:translateY(40px);opacity:.5;}to{transform:none;opacity:1;}}
@media(min-width:560px){.scrim{align-items:center;}.sheet{border-radius:18px;}}
.sheet h3{font-size:18px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;}
.field textarea{min-height:70px;resize:vertical;}
.row2{display:flex;gap:10px;} .row2>*{flex:1;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;padding:10px;border-radius:9px;background:var(--bg);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);}
.seg button.on{background:var(--surface2);color:var(--text);border-color:var(--accent);}
.seg button.on.g{border-color:var(--green);color:var(--green);} .seg button.on.y{border-color:var(--yellow);color:var(--yellow);}
.sheet-actions{display:flex;gap:10px;margin-top:8px;}
.del{color:var(--red);margin-right:auto;align-self:center;font-size:14px;font-weight:600;}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px;}
.emoji-pick button{font-size:20px;padding:7px;border-radius:9px;border:1px solid var(--border);background:var(--bg);}
.emoji-pick button.on{border-color:var(--accent);background:var(--surface2);}

/* ---------- dashboard bits ---------- */
.hero{display:flex;align-items:center;gap:16px;margin-bottom:4px;}
.hero .big{font-size:26px;font-weight:700;letter-spacing:-.5px;}
.hero .sub{color:var(--muted);font-size:13px;margin-top:2px;}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.statcard{flex:1;min-width:90px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.statcard b{font-size:22px;display:block;} .statcard span{font-size:11px;color:var(--muted);}

/* ---------- status / trend / nudge ---------- */
.ryg{width:10px;height:10px;border-radius:50%;flex:none;}
.ryg.green{background:var(--green);} .ryg.yellow{background:var(--yellow);} .ryg.red{background:var(--red);}
.trend{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:30px;font-weight:700;font-size:13px;border:1px solid;white-space:nowrap;}
.trend.green{background:rgba(126,231,135,.12);color:var(--green);border-color:rgba(126,231,135,.4);}
.trend.yellow{background:rgba(227,179,65,.12);color:#f0cf7a;border-color:rgba(227,179,65,.4);}
.trend.red{background:rgba(248,81,73,.12);color:#ff9d96;border-color:rgba(248,81,73,.4);}
.banner{border-radius:12px;padding:14px 16px;margin:4px 0 6px;font-size:14px;line-height:1.45;border:1px solid;}
.banner.red{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.35);}
.banner.yellow{background:rgba(227,179,65,.1);border-color:rgba(227,179,65,.35);}
.banner b{color:var(--text);} .banner ul{margin:8px 0 0 18px;} .banner li{margin:3px 0;}
.banner .nudge{margin-top:10px;font-style:italic;color:var(--text);}
.daybtn.has::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--accent);margin:3px auto 0;}
.daybtn.active.has::after{background:#08121f;}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;background:var(--bg);z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;}
#gate input{font-size:22px;letter-spacing:6px;text-align:center;width:180px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:14px;}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:30px;font-size:13px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:fade .2s;}
</style>
</head>
<body>

<!-- PIN gate -->
<div id="gate" class="hide">
  <div style="font-size:32px">🔒</div>
  <div style="text-align:center"><b style="font-size:18px">June Planner</b><div style="color:var(--muted);font-size:13px;margin-top:4px">Enter your PIN</div></div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" />
  <button class="btn" onclick="tryPin()">Unlock</button>
  <div id="pinerr" style="color:var(--red);font-size:13px;height:16px"></div>
</div>

<header class="hide" id="bar">
  <h1>June <span>Planner</span></h1>
  <div class="sync"><span id="syncTxt">Saved</span><span class="dot" id="dot"></span></div>
  <div class="ring" id="ring"><b>0%</b></div>
</header>

<main class="hide" id="app"></main>

<nav class="hide" id="nav">
  <button data-v="dash" class="active" onclick="go('dash')"><span class="ic">🏠</span>Today</button>
  <button data-v="rocks" onclick="go('rocks')"><span class="ic">🪨</span>Rocks</button>
  <button data-v="sched" onclick="go('sched')"><span class="ic">📅</span>Schedule</button>
</nav>

<script>
/* =========================================================================
   June Planner — built from the "big rocks" framework.
   Big rocks  ->  milestones (deadline, est. hours, priority, status)
   Time       ->  schedule (recurring classes/work + scheduled milestones)
   Everything auto-saves to Netlify Blobs via /.netlify/functions/planner
   ========================================================================= */

const API = 'https://inikaiyer-portfolio.vercel.app/api/planner';
const LS_KEY = 'junePlannerState';
const DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYF = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

/* ---- seed: your real rocks + recurring commitments (used only on first run) ---- */
function seed(){
  return {
    version:2, updatedAt:new Date().toISOString(),
    // pace knobs for the auto-planner
    settings:{dailyCapMins:180, sessionCapMins:90},
    // Recurring commitments. day: 0=Sun..6=Sat. times in "HH:MM".
    recurring:[
      {id:'r1',title:'Tech Theater class',  days:[1,2,3,5],   start:'08:50',end:'09:50',rock:'math'},
      {id:'r2',title:'Bellevue College math',days:[1,2,3,4,5],start:'11:30',end:'12:20',rock:'math'},
      {id:'r3',title:'Work',                 days:[1],         start:'17:00',end:'19:00',rock:'work'},
      {id:'r4',title:'Work',                 days:[6],         start:'09:00',end:'11:30',rock:'work'},
    ],
    // Free-time windows the auto-planner is allowed to fill (around the commitments above).
    availability:[
      {id:'a1',days:[1,2,3,4,5],start:'15:30',end:'18:00'},  // weekday after school
      {id:'a2',days:[1,2,3,4],  start:'19:00',end:'20:30'},  // weekday evening (not Fri)
      {id:'a3',days:[6,0],      start:'10:00',end:'16:00'},  // weekend
    ],
    sessions:[],   // auto/manual work blocks placed on the calendar
    infeasibleIds:[],
    rocks:[
      {id:'math',  emoji:'📐',name:'Pass my classes (Math)',
        milestones:[
          {id:m(),title:'Finish makeup work',deadline:'2026-06-05',hours:3,priority:1,status:'todo'},
          {id:m(),title:'Figure out WHY I freeze / don’t retain (problem-solve it)',deadline:'2026-06-07',hours:2,priority:1,status:'todo',notes:'Stress? Didn’t know it? Didn’t remember it? Find the real cause before fixing.'},
          {id:m(),title:'Prep for the June 12 exam',deadline:'2026-06-12',hours:5,priority:1,status:'todo'},
          {id:m(),title:'Revision for the final (tests 1-3 + new material)',deadline:'2026-06-22',hours:6,priority:2,status:'todo'},
          {id:m(),title:'Aruna’s homework (weekly)',deadline:'',hours:2,priority:2,status:'todo'},
          {id:m(),title:'Teacher’s homework (weekly)',deadline:'',hours:2,priority:2,status:'todo'},
        ]},
      {id:'python',emoji:'🐍',name:'Python class',
        milestones:[
          {id:m(),title:'Stay on top of assignments',deadline:'',hours:2,priority:3,status:'todo'},
          {id:m(),title:'Prep for Python exam',deadline:'',hours:3,priority:2,status:'todo'},
        ]},
      {id:'biz',   emoji:'💼',name:'Business class',
        milestones:[{id:m(),title:'Finish assignments + exam',deadline:'',hours:2,priority:3,status:'todo'}]},
      {id:'grad',  emoji:'🎓',name:'Plan & celebrate graduation',
        milestones:[
          {id:m(),title:'Plan the grad party (where / what goes where)',deadline:'',hours:2,priority:2,status:'todo'},
          {id:m(),title:'Send invitations (Amma, friends, family)',deadline:'',hours:1,priority:2,status:'todo'},
          {id:m(),title:'Order the food',deadline:'',hours:1,priority:2,status:'todo'},
          {id:m(),title:'Get my clothes',deadline:'',hours:1,priority:3,status:'todo'},
          {id:m(),title:'Haircut',deadline:'',hours:1,priority:3,status:'todo'},
          {id:m(),title:'Power-wash + clean + set up photo wall',deadline:'',hours:3,priority:3,status:'todo'},
        ]},
      {id:'senior',emoji:'🎉',name:'Enjoy senior year',
        milestones:[
          {id:m(),title:'Prom stuff',deadline:'',hours:0,priority:3,status:'todo'},
          {id:m(),title:'Hang out with Corbin',deadline:'',hours:0,priority:3,status:'todo'},
          {id:m(),title:'Visit friends',deadline:'',hours:0,priority:3,status:'todo'},
          {id:m(),title:'Attend friends’ grad parties',deadline:'',hours:0,priority:3,status:'todo'},
          {id:m(),title:'Help Arya with proposing / asking',deadline:'',hours:0,priority:3,status:'todo'},
        ]},
      {id:'college',emoji:'🏫',name:'Get ready for college',
        milestones:[{id:m(),title:'College prep tasks',deadline:'',hours:0,priority:3,status:'todo'}]},
      {id:'family',emoji:'❤️',name:'Family time',milestones:[]},
      {id:'friends',emoji:'🧑‍🤝‍🧑',name:'Friends time',milestones:[]},
      {id:'fit',   emoji:'🏃‍♀️',name:'Workout',milestones:[]},
      {id:'eat',   emoji:'🥗',name:'Eat well',milestones:[]},
      {id:'work',  emoji:'💵',name:'Job / Work',milestones:[]},
    ]
  };
}

/* ---- state + helpers ---- */
let state=null, view='dash', selDate=todayISO(), pin='';
function m(){ return 'm'+Math.floor(performance.now()*1000)+'_'+(m._n=(m._n||0)+1); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const [y,mo,d]=s.split('-').map(Number); return new Date(y,mo-1,d); }
function fmtTime(hhmm){ let [h,mi]=hhmm.split(':').map(Number); const ap=h<12?'AM':'PM'; h=h%12||12; return h+(mi?':'+String(mi).padStart(2,'0'):'')+' '+ap; }
function daysUntil(iso){ if(!iso) return null; const a=parseISO(iso), b=parseISO(todayISO()); return Math.round((a-b)/864e5); }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const $=s=>document.querySelector(s);
const JUNE_END='2026-06-30';
const NUDGE_API='https://inikaiyer-portfolio.vercel.app/api/nudge';
function minToHHMM(mn){ const h=Math.floor(mn/60),mi=mn%60; return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoRange(a,b){ const out=[]; let d=parseISO(a); const end=parseISO(b); while(d<=end){ out.push(isoOf(d)); d.setDate(d.getDate()+1);} return out; }
function fmtHrs(mn){ const h=mn/60; return (Math.round(h*2)/2)+'h'; }

/* ---- sessions / capacity ---- */
function sessionsOf(msId){ return (state.sessions||[]).filter(s=>s.msId===msId); }
function doneMins(msId){ return sessionsOf(msId).filter(s=>s.done).reduce((a,s)=>a+(s.mins||0),0); }
function busyBase(iso){ // recurring commitments + manual blocks (NOT auto sessions)
  const dow=parseISO(iso).getDay(), busy=[];
  (state.recurring||[]).forEach(r=>{ if(r.days.includes(dow)) busy.push([toMin(r.start),toMin(r.end)]); });
  (state.blocks||[]).forEach(b=>{ if(b.date===iso&&b.start&&b.end) busy.push([toMin(b.start),toMin(b.end)]); });
  return busy;
}
function freeIntervals(iso, extraBusy){ // free windows minus busy, as [[start,end],...] in minutes
  const dow=parseISO(iso).getDay();
  const wins=(state.availability||[]).filter(a=>a.days.includes(dow)).map(a=>[toMin(a.start),toMin(a.end)]);
  const busy=busyBase(iso).concat(extraBusy||[]).sort((a,b)=>a[0]-b[0]);
  const free=[];
  wins.forEach(win=>{ let segs=[win.slice()];
    busy.forEach(([bs,be])=>{ segs=segs.flatMap(([s,e])=>{
      if(be<=s||bs>=e) return [[s,e]];
      const o=[]; if(bs>s)o.push([s,Math.min(bs,e)]); if(be<e)o.push([Math.max(be,s),e]); return o; }); });
    free.push(...segs); });
  return free.filter(([s,e])=>e-s>=15).sort((a,b)=>a[0]-b[0]);
}

/* ---- auto-scheduler: returns a staged proposal, not committed ---- */
function buildProposedSchedule(){
  const keep=(state.sessions||[]).filter(s=>s.done||s.auto===false);  // preserve done + manual
  const placed={}; keep.forEach(s=>{ (placed[s.date]=placed[s.date]||[]).push([toMin(s.start),toMin(s.end)]); });
  const sessionCap=(state.settings&&state.settings.sessionCapMins)||90;
  const dailyCap=(state.settings&&state.settings.dailyCapMins)||180;
  const start=todayISO();
  const tasks=[];
  state.rocks.forEach(r=>r.milestones.forEach(ms=>{
    if(ms.status==='done') return;
    const remaining=Math.round((ms.hours||0)*60)-doneMins(ms.id);
    if(remaining>=15) tasks.push({ms,rock:r,remaining});
  }));
  tasks.sort((a,b)=>{ const da=a.ms.deadline||'9999-99', db=b.ms.deadline||'9999-99';
    return da!==db ? (da<db?-1:1) : (a.ms.priority||3)-(b.ms.priority||3); });
  const newSessions=[], infeasible=[];
  tasks.forEach(t=>{
    if(t.ms.deadline && t.ms.deadline<start){ infeasible.push({ms:t.ms,rock:t.rock,shortMins:t.remaining}); return; }
    let rem=t.remaining; const lastDay=t.ms.deadline||JUNE_END;
    for(const iso of isoRange(start,lastDay)){
      if(rem<15) break;
      const usedToday=(placed[iso]||[]).reduce((a,[s,e])=>a+(e-s),0);
      const dayLeft=dailyCap-usedToday; if(dayLeft<15) continue;
      const free=freeIntervals(iso, placed[iso]||[]); if(!free.length) continue;
      const [fs,fe]=free[0];
      const size=Math.min(sessionCap, rem, dayLeft, fe-fs); if(size<15) continue;
      newSessions.push({id:'s'+m(),msId:t.ms.id,rockId:t.rock.id,date:iso,start:minToHHMM(fs),end:minToHHMM(fs+size),mins:size,done:false,auto:true});
      (placed[iso]=placed[iso]||[]).push([fs,fs+size]); rem-=size;
    }
    if(rem>=15) infeasible.push({ms:t.ms,rock:t.rock,shortMins:rem});
  });
  return {sessions:keep.concat(newSessions), placedCount:newSessions.length,
    totalMins:newSessions.reduce((a,s)=>a+s.mins,0),
    days:new Set(newSessions.map(s=>s.date)).size, infeasible};
}

/* ---- progress (hours-aware) ---- */
function rockProgress(rock){
  let unitTotal=0,unitDone=0,hoursTot=0,hoursDone=0,msDone=0;
  rock.milestones.forEach(ms=>{
    const hm=Math.round((ms.hours||0)*60), unit=hm||60;
    unitTotal+=unit; hoursTot+=hm;
    if(ms.status==='done'){ unitDone+=unit; hoursDone+=hm; msDone++; }
    else { const dm=Math.min(hm,doneMins(ms.id)); unitDone+=Math.min(unit,dm); hoursDone+=dm; }
  });
  return {pct: unitTotal?Math.round(unitDone/unitTotal*100):null, leftMin:Math.max(0,hoursTot-hoursDone),
    msDone, msTotal:rock.milestones.length, hasHours:hoursTot>0, unitTotal, unitDone};
}
function overallPct(){ let t=0,d=0; state.rocks.forEach(r=>{const p=rockProgress(r); t+=p.unitTotal; d+=p.unitDone;}); return t?Math.round(d/t*100):0; }

/* ---- on-track status: green / yellow / red per rock ---- */
function rockStatus(rock){
  const t=todayISO(); const behind=[], reasons=[]; let blown=0,missed=0,urgent=0;
  rock.milestones.forEach(ms=>{
    if(ms.status==='done') return;
    if(ms.deadline && ms.deadline<t){ blown++; behind.push({kind:'overdue',ms}); }
    else if(ms.deadline){ const du=daysUntil(ms.deadline);
      const remPct = ms.hours ? 1-Math.min(1,doneMins(ms.id)/(ms.hours*60)) : (ms.status==='prog'?0.5:1);
      if(du<=2 && remPct>0.5){ urgent++; behind.push({kind:'urgent',ms,du}); } }
  });
  (state.sessions||[]).forEach(s=>{ if(s.rockId===rock.id && s.date<t && !s.done){ const ms=findMsById(s.msId); if(ms&&ms.status!=='done') missed++; } });
  const infeas=rock.milestones.filter(ms=>(state.infeasibleIds||[]).includes(ms.id)).length;
  let color='green';
  if(blown||infeas||missed>=3) color='red'; else if(missed>=1||urgent>=1) color='yellow';
  if(blown) reasons.push(`${blown} past deadline`);
  if(infeas) reasons.push(`${infeas} won't fit in time`);
  if(missed) reasons.push(`${missed} missed session${missed>1?'s':''}`);
  if(urgent) reasons.push(`${urgent} due very soon`);
  return {color,reasons,behind,blown,missed,urgent};
}
function overallTrend(){
  const reds=[],yellows=[];
  state.rocks.forEach(r=>{ if(!r.milestones.length) return; const st=rockStatus(r);
    if(st.color==='red') reds.push({rock:r,st}); else if(st.color==='yellow') yellows.push({rock:r,st}); });
  return {color: reds.length?'red':yellows.length?'yellow':'green', reds, yellows};
}
function syncMsFromSessions(msId){
  const ms=findMsById(msId); if(!ms) return; const ss=sessionsOf(msId); if(!ss.length) return;
  ms.status = ss.every(s=>s.done)?'done' : ss.some(s=>s.done)?'prog' : 'todo';
}

let saveTimer=null, saving=false;
function setSync(s){ const dot=$('#dot'),t=$('#syncTxt');
  dot.className='dot'+(s==='saving'?' saving':s==='error'?' error':'');
  t.textContent=s==='saving'?'Saving…':s==='error'?'Offline — retrying':'Saved'; }

async function apiGet(){
  const r=await fetch(API,{headers:{'x-planner-pin':pin}});
  if(r.status===401) throw {auth:true};
  return (await r.json()).state;
}
function save(){
  setSync('saving');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,700);
}
async function doSave(){
  if(saving){ save(); return; }
  saving=true;
  state.updatedAt=new Date().toISOString();
  try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){}  // local mirror — never lose data
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-planner-pin':pin},body:JSON.stringify({state})});
    if(!r.ok) throw new Error('save failed');
    setSync('ok');
  }catch(e){ setSync('error'); setTimeout(save,3000); }
  finally{ saving=false; }
}

/* status cycle: todo -> prog -> done -> todo */
function cycleStatus(rid,mid){

  const ss=sessionsOf(mid);                       // keep scheduled sessions in sync
  if(ms.status==='done') ss.forEach(s=>s.done=true);
  else if(ms.status==='todo') ss.forEach(s=>s.done=false);

  const bed=(dow===0||dow===6)?21:22;
  h+=`<div class="card" style="padding:8px 14px">`;
  for(let t=Math.floor(wake);t<bed;t++){
    const slotStart=t*60, slotEnd=(t+1)*60;
    const inSlot=events.filter(e=>{const mn=toMin(e.start);return mn>=slotStart&&mn<slotEnd;});
    const label=fmtTime(String(t).padStart(2,'0')+':00');
    h+=`<div class="slot"><div class="slot-time">${label}</div><div class="slot-body">`;
    inSlot.forEach(e=>h+=schedEvt(e));

  h+=`</div></div>`;
  $('#app').innerHTML=h;
}

function toMin(hhmm){ if(!hhmm) return 1e9; const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function schedEvt(e){

/* Build the merged event list for a date: recurring + scheduled milestones + one-off blocks */
function eventsFor(iso){
  const dt=parseISO(iso), dow=dt.getDay(), out=[];
  // recurring
  state.recurring.forEach(r=>{ if(r.days.includes(dow)){
    const rk=state.rocks.find(x=>x.id===r.rock);
    out.push({key:'rec:'+r.id+':'+iso,title:r.title,start:r.start,end:r.end,status:recStatus(r.id,iso),
      rockName:rk?rk.name:'',color:'#7ee787',recId:r.id});
  }});
  // auto/manual work sessions
  (state.sessions||[]).forEach(s=>{ if(s.date===iso){
    const rk=state.rocks.find(x=>x.id===s.rockId), ms=findMsById(s.msId);
    out.push({key:'ses:'+s.id,title:(ms?ms.title:'Focused work'),start:s.start,end:s.end,
      status:s.done?'done':'todo',sesId:s.id,msId:s.msId,rockId:s.rockId,rockName:rk?rk.name:'',color:'#58a6ff'});
  }});
  // legacy single-slot scheduled milestones
  state.rocks.forEach(rk=>rk.milestones.forEach(x=>{ if(x.scheduledDate===iso){
    out.push({key:'ms:'+x.id,title:x.title,start:x.scheduledStart||'',end:'',status:x.status,
      msId:x.id,rockId:rk.id,rockName:rk.name,color:'#bc8cff'});
  }}));
  // one-off blocks
  (state.blocks||[]).filter(b=>b.date===iso).forEach(b=>{
    out.push({key:'blk:'+b.id,title:b.title,start:b.start||'',end:b.end||'',status:b.status||'todo',blkId:b.id,color:'#bc8cff'});
  });
  return out.sort((a,b)=>toMin(a.start)-toMin(b.start));
}
function recStatus(rid,iso){ const k=rid+':'+iso; return (state.recDone&&state.recDone[k])||'todo'; }

function toggleEvt(key){
  const [type,id,iso]=key.split(':');
  if(type==='rec'){ state.recDone=state.recDone||{}; const k=id+':'+iso;
    const cur=state.recDone[k]||'todo'; state.recDone[k]=cur==='todo'?'prog':cur==='prog'?'done':'todo'; }
  else if(type==='ses'){ const s=(state.sessions||[]).find(x=>x.id===id); if(s){ s.done=!s.done; syncMsFromSessions(s.msId); } }
  else if(type==='ms'){ const ms=findMsById(id); if(ms) ms.status=ms.status==='todo'?'prog':ms.status==='prog'?'done':'todo'; }
  else if(type==='blk'){ const b=(state.blocks||[]).find(b=>b.id===id); if(b) b.status=b.status==='todo'?'prog':b.status==='prog'?'done':'todo'; }
  save(); render();
}
function findMsById(id){ for(const r of state.rocks){ const x=r.milestones.find(m=>m.id===id); if(x) return x; } return null; }

      <div class="field"><label>At time</label><input id="f_schedTime" type="time" value="${ms.scheduledStart||''}"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Any details…">${escapeHtml(ms.notes||'')}</textarea></div>
    <div class="sheet-actions">
      ${mid?`<button class="del" onclick="delMs()">Delete</button>`:''}
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn" onclick="saveMs()">Save</button>
    </div>`);
  segWire('f_pri'); segWire('f_status');
  setTimeout(()=>$('#f_title').focus(),50);
}
function segWire(id){ const el=$('#'+id); el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  el.querySelectorAll('button').forEach(x=>x.classList.remove('on','g','y'));
  b.classList.add('on'); if(b.dataset.v==='done')b.classList.add('g'); if(b.dataset.v==='prog')b.classList.add('y'); el.dataset.val=b.dataset.v; }); }
function segVal(id,def){ const el=$('#'+id); return el.dataset.val|| (el.querySelector('.on')?.dataset.v) || def; }

function saveMs(){
  const {rid,mid,ms}=editing;
  ms.title=$('#f_title').value.trim()||'Untitled';
  ms.deadline=$('#f_deadline').value;
  ms.hours=parseFloat($('#f_hours').value)||0;
  ms.priority=parseInt(segVal('f_pri',3));
  ms.status=segVal('f_status','todo');
  ms.scheduledDate=$('#f_schedDate').value;
  ms.scheduledStart=$('#f_schedTime').value;
  ms.notes=$('#f_notes').value.trim();
  const r=state.rocks.find(r=>r.id===rid);
  if(!mid) r.milestones.push(ms);
  closeSheet(); save(); render();
}
function delMs(){ const {rid,ms}=editing; const r=state.rocks.find(r=>r.id===rid);
  r.milestones=r.milestones.filter(x=>x.id!==ms.id); closeSheet(); save(); render(); }

const EMOJIS=['📐','🐍','💼','🎓','🎉','🏫','❤️','🧑‍🤝‍🧑','🏃‍♀️','🥗','💵','🎯','📚','🎨','🎵','✈️','🛒','🧹','💪','🌟'];
function openRockEdit(rid){
  const r=rid?state.rocks.find(x=>x.id===rid):{id:'rk'+m(),emoji:'🎯',name:'',milestones:[]};
  editing={rockEdit:r,isNew:!rid};
  sheet(`
    <h3>${rid?'Edit':'New'} rock</h3>
    <div class="field"><label>Name</label><input id="f_rname" value="${escapeHtml(r.name)}" placeholder="e.g. Pass my classes"></div>
    <div class="field"><label>Icon</label><div class="emoji-pick" id="f_emoji">
      ${EMOJIS.map(e=>`<button class="${e===r.emoji?'on':''}" data-e="${e}">${e}</button>`).join('')}</div></div>
    <div class="sheet-actions">
      ${rid?`<button class="del" onclick="delRock('${r.id}')">Delete</button>`:''}
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn" onclick="saveRock()">Save</button>
    </div>`);
  let chosen=r.emoji;
  $('#f_emoji').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('#f_emoji').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); chosen=b.dataset.e; editing.emoji=chosen; });
  editing.emoji=chosen;
}
function saveRock(){ const {rockEdit,isNew}=editing; rockEdit.name=$('#f_rname').value.trim()||'New rock'; rockEdit.emoji=editing.emoji||rockEdit.emoji;
  if(isNew) state.rocks.push(rockEdit); closeSheet(); save(); render(); }
function delRock(id){ if(!confirm('Delete this rock and its milestones?'))return; state.rocks=state.rocks.filter(r=>r.id!==id); openRock=null; closeSheet(); save(); render(); }

/* quick-add a one-off block on the schedule */
function quickAdd(time){
  editing={blkNew:true};
  sheet(`
    <h3>Add to ${parseISO(selDate).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</h3>
    <div class="field"><label>What are you doing?</label><input id="b_title" placeholder="e.g. Homework, gym, hang with Kyler"></div>
    <div class="row2">
      <div class="field"><label>Start</label><input id="b_start" type="time" value="${time}"></div>
      <div class="field"><label>End</label><input id="b_end" type="time"></div>
    </div>
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveBlock()">Add</button></div>`);
  setTimeout(()=>$('#b_title').focus(),50);
}
function editBlock(key){ const id=key.split(':')[1]; const b=(state.blocks||[]).find(x=>x.id===id); if(!b)return;
  editing={blk:b};
  sheet(`
    <h3>Edit block</h3>
    <div class="field"><label>What are you doing?</label><input id="b_title" value="${escapeHtml(b.title)}"></div>
    <div class="row2"><div class="field"><label>Start</label><input id="b_start" type="time" value="${b.start||''}"></div>
      <div class="field"><label>End</label><input id="b_end" type="time" value="${b.end||''}"></div></div>
    <div class="sheet-actions"><button class="del" onclick="delBlock('${b.id}')">Delete</button>
      <button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveBlock()">Save</button></div>`);
}
function saveBlock(){ state.blocks=state.blocks||[];
  if(editing.blk){ editing.blk.title=$('#b_title').value.trim()||'Block'; editing.blk.start=$('#b_start').value; editing.blk.end=$('#b_end').value; }
  else { state.blocks.push({id:'b'+m(),date:selDate,title:$('#b_title').value.trim()||'Block',start:$('#b_start').value,end:$('#b_end').value,status:'todo'}); }
  closeSheet(); save(); render();
}
function delBlock(id){ state.blocks=(state.blocks||[]).filter(b=>b.id!==id); closeSheet(); save(); render(); }

/* ====================== AVAILABILITY EDITOR ====================== */
function openAvailability(){
  let h=`<h3>When are you free to work?</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px">The auto-planner only drops work into these windows — never on top of your classes, work shifts, or anything you've added.</p>`;
  (state.availability||[]).forEach(a=>{
    const dl=[1,2,3,4,5,6,0].filter(d=>a.days.includes(d)).map(d=>DAYN[d]).join(' ');
    h+=`<div class="card" style="padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="openAvailWin('${a.id}')">
      <div style="flex:1"><div style="font-weight:600">${dl||'—'}</div><div class="rock-meta">${fmtTime(a.start)} – ${fmtTime(a.end)}</div></div>
      <button class="ms-edit" onclick="event.stopPropagation();delAvail('${a.id}')">✕</button></div>`;
  });
  if(!(state.availability||[]).length) h+=`<div class="empty">No free-time windows yet.</div>`;
  h+=`<button class="btn ghost full" style="margin-top:4px" onclick="openAvailWin(null)">＋ Add a free-time window</button>
    <div class="sheet-actions" style="margin-top:14px"><button class="btn full" onclick="closeSheet()">Done</button></div>`;
  sheet(h);
}
function openAvailWin(id){
  const a=id?(state.availability||[]).find(x=>x.id===id):{id:'a'+m(),days:[1,2,3,4,5],start:'15:30',end:'18:00'};
  editing={avail:a,isNew:!id};
  sheet(`<h3>${id?'Edit':'New'} free window</h3>
    <div class="field"><label>Days</label><div class="seg" id="av_days">
      ${[1,2,3,4,5,6,0].map(d=>`<button data-d="${d}" class="${a.days.includes(d)?'on':''}">${DAYN[d]}</button>`).join('')}</div></div>
    <div class="row2"><div class="field"><label>From</label><input id="av_s" type="time" value="${a.start}"></div>
      <div class="field"><label>To</label><input id="av_e" type="time" value="${a.end}"></div></div>
    <div class="sheet-actions">${id?`<button class="del" onclick="delAvail('${a.id}')">Delete</button>`:''}
      <button class="btn ghost" onclick="openAvailability()">Back</button><button class="btn" onclick="saveAvail()">Save</button></div>`);
  $('#av_days').querySelectorAll('button').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
}
function saveAvail(){
  const {avail,isNew}=editing;
  const days=[...$('#av_days').querySelectorAll('button.on')].map(b=>+b.dataset.d);
  avail.days=days.length?days:[1]; avail.start=$('#av_s').value||'15:30'; avail.end=$('#av_e').value||'18:00';
  if(isNew){ state.availability=state.availability||[]; state.availability.push(avail); }
  save(); openAvailability();
}
function delAvail(id){ state.availability=(state.availability||[]).filter(a=>a.id!==id); save(); openAvailability(); }

/* ====================== AUTO-PLAN (propose → verify → commit) ====================== */
let proposal=null;
function autoPlan(){
  proposal=buildProposedSchedule();
  const hrs=fmtHrs(proposal.totalMins);
  let warn='';
  if(proposal.infeasible.length){
    warn=`<div class="banner red" style="margin-bottom:12px">⚠️ ${proposal.infeasible.length} task${proposal.infeasible.length>1?'s':''} won't fully fit before ${proposal.infeasible.length>1?'their deadlines':'its deadline'} with your current free time:
      <ul>${proposal.infeasible.map(i=>`<li><b>${escapeHtml(i.ms.title)}</b> — ${fmtHrs(i.shortMins)} short</li>`).join('')}</ul>
      <div style="margin-top:6px;font-size:12px">Add more free time, lower the hours, or move the deadline.</div></div>`;
  }
  if(!proposal.placedCount && !warn){
    sheet(`<h3>✨ Auto-plan</h3><div class="empty">Everything with a time estimate is already scheduled or done. Add hours/deadlines to a milestone, or add free-time windows, then try again.</div>
      <div class="sheet-actions"><button class="btn full" onclick="closeProposal()">OK</button></div>`); return;
  }
  sheet(`<h3>✨ Here's my proposed plan</h3>
    ${warn}
    <p style="color:var(--muted);font-size:14px;margin-bottom:14px">I placed <b style="color:var(--text)">${hrs}</b> of focused work across <b style="color:var(--text)">${proposal.days} day${proposal.days!==1?'s':''}</b>, fitting only into your free windows (around classes &amp; work). Anything you've already finished stays put.</p>
    <div class="sheet-actions"><button class="btn ghost" onclick="closeProposal()">Discard</button><button class="btn" onclick="acceptProposal()">Accept plan</button></div>`);
}
function acceptProposal(){
  if(!proposal) return;
  state.sessions=proposal.sessions;
  state.infeasibleIds=proposal.infeasible.map(i=>i.ms.id);
  proposal=null; closeSheet(); save(); view='sched'; render();
  toast('Plan added to your schedule ✓');
}
function closeProposal(){ proposal=null; closeSheet(); }

/* ====================== NUDGE (dynamic encouragement, with fallback) ====================== */
async function fetchNudge(trend){
  try{
    const probs=[...trend.reds,...trend.yellows];
    const summary=probs.map(p=>`${p.rock.name}: ${p.st.reasons.join(', ')}`).join('; ');
    const r=await fetch(NUDGE_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary,status:trend.color})});
    if(!r.ok) return; const d=await r.json();
    if(d&&d.reply){ const el=$('#nudgeLine'); if(el) el.textContent=d.reply; }
  }catch(e){/* keep the static line */}
}

/* ====================== BOOT ====================== */
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
/* fill in fields added in later versions so older saved data keeps working */
function ensureDefaults(s){
  if(!s) return s;
  if(!s.settings) s.settings={dailyCapMins:180, sessionCapMins:90};
  if(!s.availability) s.availability=seed().availability;
  if(!s.sessions) s.sessions=[];
  if(!s.infeasibleIds) s.infeasibleIds=[];
  return s;
}

function loadLocal(){ try{ const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }

async function boot(){
  try{
    const remote=await apiGet();
    state = ensureDefaults(remote || loadLocal() || seed());   // cloud wins; else local cache; else fresh seed
    await doSave();                             // mirror locally + push to cloud (if configured)
    showApp();
  }catch(e){
    if(e&&e.auth){ showGate(); return; }
    state = ensureDefaults(loadLocal() || seed());              // offline: use last local copy, keep working
    showApp(); save(); toast('Offline — changes are saved here and will sync when back online');
  }
}
function showGate(){ $('#gate').classList.remove('hide'); setTimeout(()=>$('#pin').focus(),100);
  $('#pin').addEventListener('keydown',e=>{ if(e.key==='Enter') tryPin(); }); }
async function tryPin(){
  pin=$('#pin').value.trim();
  try{ const remote=await apiGet(); state=ensureDefaults(remote||loadLocal()||seed()); await doSave();
    localStorage.setItem('plannerPin',pin); $('#gate').classList.add('hide'); showApp();
  }catch(e){ $('#pinerr').textContent='Wrong PIN — try again'; $('#pin').value=''; $('#pin').focus(); }
}
function showApp(){ $('#bar').classList.remove('hide'); $('#app').classList.remove('hide'); $('#nav').classList.remove('hide'); setSync('ok'); render(); }

pin=localStorage.getItem('plannerPin')||'';
boot();
</script>
